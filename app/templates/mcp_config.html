<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General Agent · MCP 配置</title>
<link rel="icon" type="image/png" href="/assets/sugar-logo.png">
<link rel="apple-touch-icon" href="/assets/sugar-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>try { if (localStorage.getItem('myagent-theme') !== 'dark') document.documentElement.classList.add('theme-light'); } catch (e) { document.documentElement.classList.add('theme-light'); }</script>
<style>
  :root {
    --space-bg: #1e1e2e;
    --surface-glass: rgba(22, 22, 36, 0.96);
    --surface-glass2: rgba(40, 40, 60, 0.94);
    --surface-glass3: rgba(62, 63, 86, 0.78);
    --border-glass: rgba(205, 214, 244, 0.055);
    --border-accent: rgba(203, 166, 247, 0.22);
    --text-primary: #cdd6f4;
    --text-secondary: #a6adc8;
    --text-tertiary: #6c7086;
    --accent-gradient: linear-gradient(135deg, #b4befe 0%, #cba6f7 50%, #dac2f0 100%);
    --accent-glow: rgba(203, 166, 247, 0.28);
    --accent-brand-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a78bfa 100%);
    --accent-brand-glow: rgba(108, 92, 231, 0.28);
    --shadow-brand-glow: 0 4px 24px rgba(108, 92, 231, 0.18);
    --border-brand-accent: rgba(124, 111, 247, 0.22);
    --code-surface-bg: #1c1d2e;
    --green-accent: #a6e3a1;
    --red-accent: #f38ba8;
    --sans: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius-sm: 8px;
    --radius-md: 14px;
    --shadow-soft: 0 10px 44px rgba(0,0,0,0.38);
    --shadow-glow: 0 4px 24px rgba(203, 166, 247, 0.18);
  }
  :root.theme-light {
    --space-bg: #e4e9f2;
    --surface-glass: rgba(255, 255, 255, 0.93);
    --surface-glass2: rgba(255, 255, 255, 0.98);
    --surface-glass3: rgba(242, 245, 250, 0.98);
    --border-glass: rgba(0, 0, 0, 0.09);
    --text-primary: #0e0f1a;
    --text-secondary: #282a3a;
    --text-tertiary: #484a5e;
    --shadow-soft: 0 12px 40px rgba(0, 0, 0, 0.1), 0 2px 10px rgba(0, 0, 0, 0.04);
    --shadow-glow: 0 4px 22px rgba(99, 102, 241, 0.16);
    --accent-glow: rgba(99, 102, 241, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 14px; background: var(--space-bg); }
  body {
    font-family: var(--sans);
    background: var(--space-bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding-bottom: 3rem;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.09); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }
  ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-button { width: 0; height: 0; display: none; }
  :root.theme-light ::-webkit-scrollbar-thumb { background: rgba(15, 23, 42, 0.08); border-radius: 8px; }
  :root.theme-light ::-webkit-scrollbar-thumb:hover,
  :root.theme-light ::-webkit-scrollbar-thumb:active { background: rgba(15, 23, 42, 0.22); }

  .neo { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .orb {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.42;
    width: 460px; height: 460px; top: -8%; left: -6%; background: rgba(108, 92, 231, 0.12);
  }
  .orb2 {
    width: 340px; height: 340px; bottom: -4%; right: -4%; background: rgba(139, 92, 246, 0.1);
  }
  :root.theme-light .orb { opacity: 0.22; filter: blur(96px); }
  .grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  :root.theme-light .grid {
    background-image:
      linear-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 0, 0, 0.035) 1px, transparent 1px);
  }

  .w { position: relative; z-index: 2; max-width: 900px; margin: 0 auto; padding: 2rem 1.25rem; }

  .hd { margin-bottom: 1rem; }
  .hd h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.35rem;
    background: linear-gradient(135deg, #f0eff5 0%, #c8c6d6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  :root.theme-light .hd h1 {
    background: linear-gradient(135deg, #1f1f2e 0%, #4f46e5 55%, #6366f1 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }
  .pth { font-size: 0.75rem; color: var(--text-tertiary); word-break: break-all; margin-bottom: 1rem; }

  .fh {
    font-size: 0.8rem;
    color: var(--text-secondary);
    line-height: 1.55;
    margin-bottom: 1rem;
  }
  .fh code {
    font-family: var(--mono);
    font-size: 0.78rem;
    padding: 0.12rem 0.35rem;
    border-radius: 5px;
    background: var(--code-surface-bg);
    border: 1px solid var(--border-glass);
    color: #c4bafc;
  }
  :root.theme-light .fh code {
    background: rgba(0,0,0,0.04);
    border-color: rgba(0,0,0,0.1);
  }

  .cd {
    background: var(--surface-glass3);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-md);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    padding: 1rem 1.15rem;
    box-shadow: var(--shadow-soft);
  }
  :root.theme-light .cd { box-shadow: var(--shadow-soft), 0 1px 0 rgba(255,255,255,0.75) inset; }

  .st {
    display: none;
    margin-bottom: 0.85rem;
    padding: 0.65rem;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    font-weight: 500;
  }
  .st.e {
    display: block;
    background: rgba(243,139,168,0.12);
    border: 1px solid rgba(243,139,168,0.28);
    color: var(--red-accent);
  }
  .st.ok {
    display: block;
    background: rgba(166,227,161,0.12);
    border: 1px solid rgba(166,227,161,0.26);
    color: var(--green-accent);
  }
  :root.theme-light .st.e {
    background: rgba(254,226,226,0.85);
    border-color: rgba(243,139,168,0.35);
    color: #991b1b;
  }
  :root.theme-light .st.ok {
    background: rgba(209,250,229,0.9);
    border-color: rgba(166,227,161,0.35);
    color: #065f46;
  }

  .mono {
    font-family: var(--mono);
    font-size: 0.78rem;
    width: 100%;
    min-height: 420px;
    padding: 0.75rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-glass);
    background: var(--surface-glass2);
    color: var(--text-primary);
    resize: vertical;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .mono:focus {
    border-color: rgba(99,102,241,0.45);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.15), var(--shadow-glow);
  }
  :root.theme-light .mono {
    background: #fff;
    border-color: rgba(0,0,0,0.12);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  :root.theme-light .mono:focus {
    box-shadow: 0 0 0 3px rgba(99,102,241,0.14);
  }

  .env-toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    margin-top: 1.15rem;
    padding-top: 0;
    border-top: none;
  }
  .env-toolbar-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: flex-end;
    margin-left: auto;
  }
  a.btn.env-toolbar-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-sizing: border-box;
  }

  .btn {
    border: none;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.88rem;
    font-family: var(--sans);
    padding: 0.65rem 1.15rem;
    border-radius: var(--radius-sm);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
  }
  .b1 {
    background: var(--accent-brand-gradient);
    color: #fff;
    box-shadow: 0 4px 16px rgba(108,92,231,0.3);
  }
  .b1:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(108,92,231,0.38); }
  .b1:disabled { opacity: 0.45; cursor: not-allowed; }
  .b2 {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border-glass);
    box-sizing: border-box;
  }
  :root.theme-light .b2 { background: #fff; border-color: rgba(0,0,0,0.12); }
  :root.theme-light .b2:hover { background: rgba(0,0,0,0.03); }

  .btn-back-chat {
    background: rgba(166,227,161,0.14);
    border: 1px solid rgba(166,227,161,0.42);
    color: #6ee7b7;
    font-weight: 700;
  }
  .btn-back-chat:hover {
    border-color: rgba(166,227,161,0.55);
    color: #a7f3d0;
  }
  :root.theme-light .btn-back-chat {
    background: rgba(16,185,129,0.14);
    border-color: rgba(5,150,105,0.38);
    color: #047857;
  }
  :root.theme-light .btn-back-chat:hover {
    color: #065f46;
    border-color: rgba(5,150,105,0.5);
  }

  .mcp-page-help-footer { margin-top: 1.35rem; text-align: center; }
  .mcp-help-inline-btn {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: 0.68rem;
    color: var(--text-tertiary);
    line-height: 1.5;
    cursor: default;
    opacity: 0.92;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    background: rgba(5, 6, 18, 0.62);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
  }
  :root.theme-light .modal-overlay { background: rgba(30, 32, 48, 0.38); }
  .modal-overlay.is-open { opacity: 1; pointer-events: auto; }
  .modal-card {
    width: min(480px, 100%);
    background: var(--surface-glass);
    border: 1px solid var(--border-brand-accent);
    border-radius: 18px;
    box-shadow: var(--shadow-soft), var(--shadow-brand-glow);
    padding: 1.4rem 1.4rem 1.2rem;
    transform: translateY(10px) scale(0.98);
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  :root.theme-light .modal-card { background: var(--surface-glass2); }
  .modal-overlay.is-open .modal-card { transform: none; }
  .modal-head {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 1rem;
  }
  .modal-shield {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(99,102,241,0.18), rgba(139,92,246,0.18));
    border: 1px solid var(--border-brand-accent);
    color: #c4bafc;
  }
  .modal-title { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; }
  .modal-sub { font-size: 0.75rem; color: var(--text-tertiary); margin-top: 0.12rem; word-break: break-all; }
  .modal-body { max-height: 44vh; overflow: auto; }
  .reg-row {
    display: flex;
    gap: 0.75rem;
    padding: 0.55rem 0.15rem;
    border-bottom: 1px solid var(--border-glass);
    font-size: 0.82rem;
  }
  .reg-row:last-child { border-bottom: none; }
  .reg-label { flex: 0 0 84px; color: var(--text-tertiary); }
  .reg-value {
    color: var(--text-primary);
    word-break: break-all;
    font-family: var(--mono);
    font-size: 0.78rem;
    line-height: 1.5;
  }
  .modal-note {
    margin-top: 0.9rem;
    padding: 0.7rem 0.8rem;
    border-radius: var(--radius-sm);
    background: rgba(243,139,168,0.08);
    border: 1px solid rgba(243,139,168,0.22);
    color: var(--text-secondary);
    font-size: 0.76rem;
    line-height: 1.6;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.6rem;
    margin-top: 1.1rem;
  }
</style>
</head>
<body>
<div class="neo"><div class="orb"></div><div class="orb orb2"></div></div>
<div class="grid" aria-hidden="true"></div>
<div class="w">
<div class="hd"><h1>MCP 服务器配置</h1><div class="pth" id="cfg-path"></div></div>
<p class="fh">编辑 <code>mcp_servers.json</code>。支持 <strong>stdio</strong>（<code>command</code> + <code>args</code>）、<strong>sse</strong> 与 <strong>streamable-http</strong>（<code>url</code> + 可选 <code>headers</code>）。保存后会自动重载 MCP 连接。<br>
若设置了环境变量 <code>MCP_SERVERS_JSON</code>，运行时优先使用该变量，此处文件不会生效。</p>
<div class="cd">
<div id="status" class="st"></div>
<textarea id="json" class="mono" spellcheck="false" autocomplete="off" placeholder='{\n  "enabled": true,\n  "servers": { }\n}'></textarea>
</div>
<div class="env-toolbar">
<button type="button" class="btn btn-back-chat js-back-chat">返回聊天</button>
<div class="env-toolbar-actions">
<button type="button" class="btn b1" id="btn-save">保存并重载</button>
<button type="button" class="btn b2" id="btn-reload">放弃修改并重新加载</button>
<a href="/setup" class="btn b2 env-toolbar-link">配置向导</a>
<a href="/setup/env#mcp" class="btn b2 env-toolbar-link">返回高级设置</a>
</div>
</div>
<p class="mcp-page-help-footer"><button type="button" class="mcp-help-inline-btn" tabindex="-1">如需帮助或反馈，请联系GitHub @sugarfreeecho</button></p>
</div>
<div class="modal-overlay" id="reg-overlay" role="dialog" aria-modal="true" aria-labelledby="reg-title" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-shield">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9.2 11.8l2 2 3.8-4"/>
        </svg>
      </div>
      <div>
        <div class="modal-title" id="reg-title">注册 MCP 服务器</div>
        <div class="modal-sub" id="reg-sub"></div>
      </div>
    </div>
    <div class="modal-body" id="reg-body"></div>
    <div class="modal-note" id="reg-note"></div>
    <div class="modal-actions">
      <button type="button" class="btn b2" id="reg-cancel">暂不连接</button>
      <button type="button" class="btn b1" id="reg-ok">确认并连接</button>
    </div>
  </div>
</div>
<script>
(function(){
var pathEl=document.getElementById('cfg-path'),ta=document.getElementById('json'),st=document.getElementById('status');
var promptedRegistrations={};
function showSt(m,ok){st.textContent=m||'';st.className=m?('st '+(ok?'ok':'e')):'';st.style.display=m?'block':'none';}
var regOverlay=document.getElementById('reg-overlay'),regSub=document.getElementById('reg-sub'),regBody=document.getElementById('reg-body'),regNote=document.getElementById('reg-note');
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function closeRegistrationModal(){regOverlay.classList.remove('is-open');regOverlay.setAttribute('aria-hidden','true');}
function openRegistrationModal(item){
var caps=item&&item.capabilities?item.capabilities:{};
regSub.textContent=String(item.name||item.extension_id||'unknown');
var rows=[['类型',String(item.runtime||caps.transport||'unknown')],['命令或地址',String(item.source||'未提供')]];
if(caps.working_directory)rows.push(['工作目录',String(caps.working_directory)]);
var envs=Array.isArray(caps.configured_environment)?caps.configured_environment:[];
if(envs.length)rows.push(['配置环境变量',envs.join(', ')]);
var digest=String(item.config_digest||'');
rows.push(['配置摘要',digest.slice(0,16)+(digest.length>16?'…':'')]);
regBody.innerHTML=rows.map(function(r){return '<div class="reg-row"><div class="reg-label">'+escHtml(r[0])+'</div><div class="reg-value">'+escHtml(r[1])+'</div></div>';}).join('');
regNote.textContent='确认仅允许连接服务器并发现工具；具体工具调用仍按当前权限模式审批。该服务器将以当前操作系统用户权限运行。';
regOverlay.classList.add('is-open');regOverlay.setAttribute('aria-hidden','false');
return new Promise(function(resolve){
var okBtn=document.getElementById('reg-ok'),cancelBtn=document.getElementById('reg-cancel');
function done(v){cleanup();resolve(v);}
function onKey(e){if(e.key==='Escape'){e.preventDefault();done(false);}else if(e.key==='Enter'){e.preventDefault();done(true);}}
function cleanup(){document.removeEventListener('keydown',onKey);okBtn.removeEventListener('click',onOk);cancelBtn.removeEventListener('click',onCancel);closeRegistrationModal();}
function onOk(){done(true);}
function onCancel(){done(false);}
document.addEventListener('keydown',onKey);
okBtn.addEventListener('click',onOk);
cancelBtn.addEventListener('click',onCancel);
setTimeout(function(){okBtn.focus();},30);
});
}
async function promptMcpRegistrations(rows){
rows=Array.isArray(rows)?rows:[];
var connected=0;
for(var i=0;i<rows.length;i++){
var item=rows[i];
if(!item||item.registration_status!=='pending')continue;
var key=String(item.extension_id||'')+':'+String(item.config_digest||'');
if(promptedRegistrations[key])continue;
promptedRegistrations[key]=true;
var approved=await openRegistrationModal(item);
if(!approved)continue;
var r=await fetch('/api/security/mcp/'+encodeURIComponent(item.extension_id)+'/registration',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({approved:true,config_digest:String(item.config_digest||'')})});
var j=await r.json();
if(!r.ok||!j.ok)throw new Error(j.error||'MCP 注册失败');
connected+=1;
}
return connected;
}
async function load(){showSt('',false);try{
var r=await fetch('/api/mcp_config',{credentials:'same-origin'});var j=await r.json();
if(!j.ok)throw new Error(j.error||'加载失败');
pathEl.textContent='路径：'+(j.path||'')+(j.exists?'':'（文件不存在，保存时将创建）');
ta.value=j.text!=null?j.text:'';
var connected=await promptMcpRegistrations(j.mcp_registrations);
if(connected)showSt('已确认并连接 '+connected+' 个 MCP。',true);
}catch(e){showSt(String(e.message||e),false);}}
document.getElementById('btn-reload').addEventListener('click',load);
document.getElementById('btn-save').addEventListener('click',async function(){
showSt('',false);var b=this;b.disabled=true;
try{var r=await fetch('/api/mcp_config',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({text:ta.value})});var j=await r.json();
if(!j.ok)throw new Error(j.error||'保存失败');var connected=await promptMcpRegistrations(j.mcp_registrations);showSt(connected?'已保存，并确认连接 '+connected+' 个 MCP。':'已保存 MCP 配置；未确认的服务器不会启动。',true);}
catch(e){showSt(String(e.message||e),false);}
finally{b.disabled=false;}
});
load();
})();
</script>
<script>
(function () {
  function goBack(e) {
    e.preventDefault();
    if (window.opener && !window.opener.closed) {
      try { window.opener.focus(); } catch (x) {}
      window.close();
    } else {
      window.location.href = '/';
    }
  }
  var backs = document.querySelectorAll('.js-back-chat');
  var bi;
  for (bi = 0; bi < backs.length; bi++) {
    backs[bi].addEventListener('click', goBack);
  }
})();
</script>
<script src="/static/setup_i18n.js"></script>
</body>
</html>
