<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SugarAgent · 欢迎</title>
<link rel="icon" type="image/png" href="/assets/sugar-logo.png">
<link rel="apple-touch-icon" href="/assets/sugar-logo.png">
<script>try { if (localStorage.getItem('myagent-theme') !== 'dark') document.documentElement.classList.add('theme-light'); } catch (e) { document.documentElement.classList.add('theme-light'); }</script>
<style>
  /* ═══ 与主界面 index.html 一致的设计系统 ═══ */
  :root {
    --space-bg: #1e1e2e;
    --surface-glass: rgba(22, 22, 36, 0.96);
    --surface-glass3: rgba(62, 63, 86, 0.78);
    --border-glass: rgba(205, 214, 244, 0.055);
    --border-accent: rgba(203, 166, 247, 0.22);
    --text-primary: #cdd6f4;
    --text-secondary: #a6adc8;
    --text-tertiary: #6c7086;
    --accent-brand-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a78bfa 100%);
    --red-accent: #f38ba8;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-soft: 0 10px 44px rgba(0,0,0,0.38);
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  }
  :root.theme-light {
    --space-bg: #e4e9f2;
    --surface-glass: rgba(255, 255, 255, 0.93);
    --surface-glass3: rgba(242, 245, 250, 0.96);
    --border-glass: rgba(0, 0, 0, 0.09);
    --border-accent: rgba(99, 102, 241, 0.38);
    --text-primary: #0e0f1a;
    --text-secondary: #282a3a;
    --text-tertiary: #484a5e;
    --shadow-soft: 0 12px 40px rgba(0, 0, 0, 0.1), 0 2px 10px rgba(0, 0, 0, 0.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 14px; background: var(--space-bg); }
  body {
    font-family: var(--sans);
    background: var(--space-bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-y: auto;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  button, input, select, textarea { font-family: var(--sans); }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.09); border-radius: 8px; }
  :root.theme-light ::-webkit-scrollbar-thumb { background: rgba(15, 23, 42, 0.08); border-radius: 8px; }

  .bg-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(108, 92, 231, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(108, 92, 231, 0.04) 1px, transparent 1px);
    background-size: 32px 32px;
    z-index: 0;
    pointer-events: none;
  }
  :root.theme-light .bg-grid {
    background-image:
      linear-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
  }
  .bg-glow {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(108, 92, 231, 0.12) 0%, transparent 55%);
    z-index: 0;
    pointer-events: none;
  }
  :root.theme-light .bg-glow {
    background: radial-gradient(ellipse at 50% 0%, rgba(99, 102, 241, 0.08) 0%, transparent 58%);
  }

  .container {
    position: relative; z-index: 1;
    width: 100%; max-width: 480px;
    padding: 1.25rem;
    animation: fadeUp 0.55s var(--ease-out-expo);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .wizard-language-toggle {
    position: absolute;
    top: 1rem;
    right: 1rem;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    min-width: 2.4rem;
    justify-content: center;
    padding: .38rem .58rem;
    border: 1px solid var(--border-glass);
    border-radius: 999px;
    background: rgba(255,255,255,.055);
    color: var(--text-secondary);
    font: 700 .7rem var(--sans);
    cursor: pointer;
    transition: color .18s ease, border-color .18s ease, background .18s ease, transform .18s ease;
  }
  .wizard-language-toggle:hover { color: var(--text-primary); border-color: var(--border-accent); background: rgba(99,102,241,.12); transform: translateY(-1px); }
  .wizard-language-toggle__icon { font-size: .82rem; line-height: 1; letter-spacing: -.12em; }
  :root.theme-light .wizard-language-toggle { background: rgba(0,0,0,.035); }

  .card {
    position: relative;
    background: var(--surface-glass3);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-lg);
    padding: 2.75rem 2rem 2rem;
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow: var(--shadow-soft);
    text-align: center;
  }
  :root.theme-light .card { box-shadow: var(--shadow-soft), 0 1px 0 rgba(255,255,255,0.8) inset; }

  .logo { margin-bottom: 1.9rem; }
  .logo-icon {
    width: 56px; height: 56px;
    border-radius: var(--radius-md);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.85rem;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  .logo-icon img { width: 100%; height: 100%; display: block; pointer-events: none; }
  .logo h1 {
    font-size: 1.35rem;
    font-weight: 800;
    margin-bottom: 0.25rem;
    background: linear-gradient(135deg, #f0eff5 0%, #c8c6d6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    user-select: none;
    cursor: default;
  }
  :root.theme-light .logo h1 {
    background: linear-gradient(135deg, #1f1f2e 0%, #4f46e5 55%, #6366f1 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand-sub {
    display: flex;
    flex-direction: column;
    gap: 0.06rem;
    color: #7f8699;
    letter-spacing: 0.01em;
    line-height: 1.12;
    font-size: 0.56rem;
    user-select: none;
    cursor: default;
  }
  .brand-sub-line { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .welcome-title {
    font-size: 1.06rem;
    font-weight: 800;
    letter-spacing: 0.01em;
    margin-bottom: 0.55rem;
  }
  .welcome-sub {
    color: var(--text-secondary);
    font-size: 0.82rem;
    line-height: 1.65;
    margin: 0 auto 1.75rem;
    max-width: 21rem;
  }

  .welcome-actions { display: flex; flex-direction: column; gap: 0.6rem; }
  .btn {
    width: 100%;
    padding: 0.78rem;
    border-radius: var(--radius-sm);
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.25s var(--ease-out-expo), box-shadow 0.25s var(--ease-out-expo),
      color .18s ease, border-color .18s ease, background .18s ease;
  }
  .btn-primary {
    border: none;
    background: var(--accent-brand-gradient);
    color: #fff;
    box-shadow: 0 4px 18px rgba(108, 92, 231, 0.35);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(108, 92, 231, 0.42); }
  .btn-primary:active:not(:disabled) { transform: translateY(0); }
  .btn-ghost {
    background: rgba(255,255,255,.045);
    border: 1px solid var(--border-glass);
    color: var(--text-secondary);
  }
  .btn-ghost:hover:not(:disabled) { color: var(--text-primary); border-color: var(--border-accent); background: rgba(99,102,241,.12); }
  :root.theme-light .btn-ghost { background: rgba(0,0,0,.03); color: var(--text-secondary); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn:focus-visible { outline: 2px solid var(--border-accent); outline-offset: 2px; }

  .welcome-error {
    margin-top: 1rem;
    padding: 0.6rem 0.8rem;
    border-radius: var(--radius-sm);
    background: rgba(243,139,168,0.12);
    border: 1px solid rgba(243,139,168,0.28);
    color: var(--red-accent);
    font-size: 0.78rem;
  }
  :root.theme-light .welcome-error { background: rgba(254,226,226,0.85); border-color: rgba(243,139,168,0.35); color: #991b1b; }
</style>
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>

<main class="container">
  <div class="card">
    <button type="button" id="welcome-language-toggle" class="wizard-language-toggle" aria-label="切换为英文" title="切换语言">
      <span class="wizard-language-toggle__icon" aria-hidden="true">中/EN</span>
    </button>
    <div class="logo">
      <div class="logo-icon" aria-hidden="true"><img src="/assets/sugar-logo.png" alt="" draggable="false"></div>
      <h1>SugarAgent</h1>
      <p class="brand-sub">
        <span class="brand-sub-line brand-sub-line--en">Self-Upgrade General Agent</span>
        <span class="brand-sub-line brand-sub-line--zh">自优化通用智能平台</span>
      </p>
    </div>

    <h2 class="welcome-title" data-i18n="title">欢迎使用 SugarAgent</h2>
    <p class="welcome-sub" data-i18n="sub">先配置一个模型 API 就能开始对话，之后可随时在设置里添加或切换模型。</p>

    <div class="welcome-actions">
      <button type="button" id="welcome-start" class="btn btn-primary" data-i18n="start">立即配置首个模型</button>
      <button type="button" id="welcome-later" class="btn btn-ghost" data-i18n="later">稍后配置</button>
    </div>

    <p class="welcome-error" id="welcome-error" role="alert" hidden></p>
  </div>
</main>

<script>
(function () {
  'use strict';
  var LS_LANG = 'myagent-language';
  var COPY = {
    zh: {
      title: '欢迎使用 SugarAgent',
      sub: '先配置一个模型 API 就能开始对话，之后可随时在设置里添加或切换模型。',
      start: '立即配置首个模型',
      later: '稍后配置',
      entering: '正在进入主界面…',
      failed: '进入主界面失败，请重试。',
      docTitle: 'SugarAgent · 欢迎',
      switchLang: '切换为英文',
    },
    en: {
      title: 'Welcome to SugarAgent',
      sub: 'Add one model API to start chatting. You can add or switch models in Settings at any time.',
      start: 'Set up your first model',
      later: 'Later',
      entering: 'Opening the workspace…',
      failed: 'Could not open the workspace. Please try again.',
      docTitle: 'SugarAgent · Welcome',
      switchLang: 'Switch to Chinese',
    },
  };
  function currentLang() {
    try { return localStorage.getItem(LS_LANG) === 'en' ? 'en' : 'zh'; } catch (e) { return 'zh'; }
  }
  var lang = currentLang();
  var toggle = document.getElementById('welcome-language-toggle');
  var startBtn = document.getElementById('welcome-start');
  var laterBtn = document.getElementById('welcome-later');
  var errorEl = document.getElementById('welcome-error');

  function applyLang() {
    var copy = COPY[lang];
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
    document.title = copy.docTitle;
    Array.prototype.slice.call(document.querySelectorAll('[data-i18n]')).forEach(function (el) {
      var text = copy[el.getAttribute('data-i18n')];
      if (text) el.textContent = text;
    });
    if (toggle) {
      toggle.setAttribute('aria-label', copy.switchLang);
      toggle.setAttribute('title', copy.switchLang);
    }
  }

  function showError(message) {
    if (!errorEl) return;
    errorEl.textContent = message || COPY[lang].failed;
    errorEl.hidden = false;
  }
  function clearError() {
    if (errorEl) errorEl.hidden = true;
  }

  if (toggle) {
    toggle.addEventListener('click', function () {
      lang = lang === 'en' ? 'zh' : 'en';
      try { localStorage.setItem(LS_LANG, lang === 'en' ? 'en' : 'zh-CN'); } catch (e) { /* ignore */ }
      applyLang();
    });
  }

  /* 立即配置：设置中心 → 模型页签，并自动弹出「添加模型」对话框。 */
  if (startBtn) {
    startBtn.addEventListener('click', function () {
      /* 带 #models 是为了兼容尚未重启的后端：即使查询参数没被识别，也能直接落到模型页签。 */
      window.location.href = '/settings?section=models&add=1#models';
    });
  }

  /* 稍后配置：记下这次选择（cookie），避免主界面被 /setup 门槛弹回欢迎页。 */
  if (laterBtn) {
    laterBtn.addEventListener('click', async function () {
      clearError();
      var label = laterBtn.textContent;
      laterBtn.disabled = true;
      laterBtn.textContent = COPY[lang].entering;
      try {
        var resp = await fetch('/api/setup/skip', { method: 'POST', credentials: 'same-origin' });
        var data = await resp.json().catch(function () { return {}; });
        if (!resp.ok || !data || !data.ok) throw new Error((data && data.error) || 'skip failed');
        window.location.href = '/';
      } catch (err) {
        laterBtn.disabled = false;
        laterBtn.textContent = label;
        showError(COPY[lang].failed);
      }
    });
  }

  applyLang();
})();
</script>
</body>
</html>
