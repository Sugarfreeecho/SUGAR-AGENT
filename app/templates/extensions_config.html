<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyAgent Hooks 与 Plugins</title>
  <link rel="icon" type="image/png" href="/assets/sugar-logo.png">
  <link rel="apple-touch-icon" href="/assets/sugar-logo.png">
  <style>
    :root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#2f81f7;--green:#3fb950;--red:#f85149;--amber:#d29922}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:1120px;margin:0 auto;padding:28px 18px 60px}.head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
    h1{font-size:24px;margin:0 0 5px}h2{font-size:17px;margin:0}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}
    button,a.btn{border:1px solid var(--line);border-radius:7px;background:#21262d;color:var(--text);padding:7px 12px;text-decoration:none;cursor:pointer}button.primary{background:var(--blue);border-color:var(--blue)}button:disabled{opacity:.55;cursor:wait}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
    .status{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px}.status.on{color:var(--green)}.status.off{color:var(--red)}
    .path{word-break:break-all;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:23px 0 10px}
    table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:600}tr:last-child td{border-bottom:0}
    code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin:1px 3px 1px 0;font-size:11px}.warn{color:var(--amber)}.error{color:var(--red)}
    .empty{padding:24px;text-align:center;color:var(--muted)}#notice{min-height:22px;margin:8px 0}.toggle{min-width:72px}.diagnostic{max-width:360px;white-space:pre-wrap;word-break:break-word}
    .install-form{display:grid;grid-template-columns:minmax(260px,1fr) minmax(130px,.3fr) auto;gap:10px;align-items:end}.field{display:grid;gap:5px}.field label{color:var(--muted);font-size:12px}.field input{width:100%;border:1px solid var(--line);border-radius:7px;background:#0d1117;color:var(--text);padding:8px 10px}.install-options{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:12px}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.danger{color:#ff938a}
    @media(max-width:760px){.grid{grid-template-columns:1fr}.head{display:block}.actions{margin-top:12px}.install-form{grid-template-columns:1fr}.table-wrap{overflow:auto}table{min-width:840px}}
  </style>
</head>
<body>
<main>
  <div class="head">
    <div><h1>Hooks 与 Plugins</h1><div class="muted">查看有效开关、已发现插件、兼容性与 Hook 注册情况。</div></div>
    <div class="actions"><button type="button" class="btn" id="wizard-language-toggle" aria-label="切换为英文" title="切换语言">中/EN</button><a class="btn" href="/setup/env#env">环境变量</a><a class="btn" href="/setup/env#mcp">MCP 配置</a><a class="btn" href="/">返回 Agent</a><button id="reload" class="primary">重新发现 / 热重载</button></div>
  </div>
  <div id="notice" aria-live="polite"></div>
  <div class="grid">
    <section class="card"><h2>Hooks <span id="hooks-status" class="status">读取中</span></h2><p class="muted">总开关：<code>HOOKS_ENABLED</code>。插件 Hook 只有在 Hooks 与 Plugins 同时启用时才加载。</p><div>配置：<span id="hooks-path" class="path">—</span></div></section>
    <section class="card"><h2>Plugins <span id="plugins-status" class="status">读取中</span></h2><p class="muted">总开关：<code>PLUGINS_ENABLED</code>。关闭后 Skill、MCP 与 Hook 组件全部从注册表移除。</p><div>目录：<span id="plugins-path" class="path">—</span></div></section>
  </div>

  <section class="card">
    <div class="section-head" style="margin-top:0"><h2>安装 / 更新插件</h2><span class="muted">本地目录、压缩包或 Git URL</span></div>
    <div class="install-form">
      <div class="field"><label for="install-source">来源</label><input id="install-source" placeholder="D:\plugins\demo 或 https://github.com/org/plugin.git"></div>
      <div class="field"><label for="install-ref">Git ref（可选）</label><input id="install-ref" placeholder="v1.2.0"></div>
      <button id="install" class="primary">安装插件</button>
    </div>
    <div class="install-options">
      <label><input type="checkbox" id="install-replace"> 已存在时更新并保留旧版本备份</label>
      <label><input type="checkbox" id="install-dependencies"> 同时安装 Python / Node 依赖</label>
    </div>
  </section>

  <div class="section-head"><h2>插件</h2><span id="plugin-count" class="muted"></span></div>
  <div class="table-wrap"><table><thead><tr><th>插件</th><th>格式 / 兼容性</th><th>组件</th><th>诊断</th><th>状态</th></tr></thead><tbody id="plugins-body"><tr><td colspan="5" class="empty">读取中…</td></tr></tbody></table></div>

  <div class="section-head"><h2>Hooks</h2><span id="hook-count" class="muted"></span></div>
  <div class="table-wrap"><table><thead><tr><th>ID</th><th>事件</th><th>匹配器</th><th>来源</th><th>策略 / 超时</th></tr></thead><tbody id="hooks-body"><tr><td colspan="5" class="empty">读取中…</td></tr></tbody></table></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sessionId=new URLSearchParams(location.search).get('session_id')||'';
function status(el,on){el.textContent=on?'已启用':'已禁用';el.className='status '+(on?'on':'off')}
function componentPills(p){const c=p.components||{};const rows=[];for(const k of ['skills','hooks','commands','mcp_servers','agents','prompts','runtime']){const v=c[k];const n=Array.isArray(v)?v.length:(v&&typeof v==='object'?(k==='runtime'?1:Object.keys(v).length):Number(v||0));if(n)rows.push(`<span class="pill">${esc(k)} ${n}</span>`)}return rows.join('')||'<span class="muted">无</span>'}
function diagnostics(p){const x=p.compatibility||{};const lines=[...(x.warnings||[]),...(p.errors||[])];return lines.length?`<span class="warn">${lines.map(esc).join('<br>')}</span>`:'<span class="muted">通过</span>'}
async function load(){
  const r=await fetch('/api/extensions',{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'读取失败');
  status($('hooks-status'),!!d.enabled?.hooks);status($('plugins-status'),!!d.enabled?.plugins);
  $('hooks-path').textContent=d.paths?.hooks||'未配置';$('plugins-path').textContent=(d.paths?.plugins||[]).join('；')||'未配置';
  const ps=d.plugins||[];$('plugin-count').textContent=`${ps.length} 个已发现`;
  $('plugins-body').innerHTML=ps.length?ps.map(p=>{const cp=p.compatibility||{};const enabled=p.configured_enabled===undefined?!!p.enabled:!!p.configured_enabled;const globalOn=!!d.enabled?.plugins;return `<tr><td><strong>${esc(p.name||p.id)}</strong><br><code>${esc(p.id)}</code> <span class="muted">${esc(p.version||'')}</span></td><td><code>${esc(p.source_format||p.format||'native')}</code><br><span class="pill">${esc(cp.status||'unknown')}</span></td><td>${componentPills(p)}</td><td class="diagnostic">${diagnostics(p)}</td><td><div class="row-actions"><button class="toggle" data-id="${esc(p.id)}" data-enabled="${enabled?'1':'0'}" ${globalOn?'':'disabled title="PLUGINS_ENABLED 已关闭"'}>${enabled?'禁用':'启用'}</button><button class="deps" data-id="${esc(p.id)}">安装依赖</button><button class="remove danger" data-id="${esc(p.id)}">卸载</button></div></td></tr>`}).join(''):'<tr><td colspan="5" class="empty">未发现插件。可在上方从本地目录、压缩包或 Git URL 安装。</td></tr>';
  const hs=d.hooks||[];$('hook-count').textContent=`${hs.length} 个已注册`;
  $('hooks-body').innerHTML=hs.length?hs.map(h=>`<tr><td><code>${esc(h.id)}</code></td><td>${esc(h.event)}</td><td><code>${esc(h.matcher||'(全部)')}</code></td><td>${esc(h.source_id||h.source||'project')}</td><td>${esc(h.failure_policy||'warn')} / ${esc(h.timeout_seconds||h.timeout||'—')}s</td></tr>`).join(''):'<tr><td colspan="5" class="empty">没有有效 Hook。</td></tr>';
  const errors=[...(d.plugin_errors||[]),...(d.hook_errors||[])];if(errors.length)note(errors.join('；'),true);else note('');
  document.querySelectorAll('.toggle').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const enabled=b.dataset.enabled!=='1';const r=await fetch('/api/plugins/'+encodeURIComponent(b.dataset.id)+'/enabled',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled,session_id:sessionId})});const x=await r.json();if(!r.ok||!x.ok)throw new Error(x.error||'操作失败');await load();note('插件状态已更新。')}catch(e){note(e.message,true)}finally{b.disabled=false}});
  document.querySelectorAll('.deps').forEach(b=>b.onclick=async()=>{b.disabled=true;try{note('正在安装依赖…');const r=await fetch('/api/plugins/'+encodeURIComponent(b.dataset.id)+'/dependencies',{method:'POST'});const x=await r.json();if(!r.ok||!x.ok)throw new Error(x.error||'依赖安装失败');await load();note('插件依赖已准备完成。')}catch(e){note(e.message,true)}finally{b.disabled=false}});
  document.querySelectorAll('.remove').forEach(b=>b.onclick=async()=>{if(!confirm(`卸载插件 ${b.dataset.id}？文件会移动到可恢复目录。`))return;b.disabled=true;try{const r=await fetch('/api/plugins/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});const x=await r.json();if(!r.ok||!x.ok)throw new Error(x.error||'卸载失败');await load();note(`插件已卸载，可从 ${x.trash_path||'回收目录'} 恢复。`)}catch(e){note(e.message,true)}finally{b.disabled=false}});
}
function note(t,bad=false){$('notice').textContent=t;$('notice').className=bad?'error':'muted'}
$('reload').onclick=async()=>{const b=$('reload');b.disabled=true;try{const r=await fetch('/api/extensions/reload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'重载失败');await load();note('发现与热重载完成。')}catch(e){note(e.message,true)}finally{b.disabled=false}};
$('install').onclick=async()=>{const b=$('install');const source=$('install-source').value.trim();if(!source){note('请输入插件来源。',true);$('install-source').focus();return}b.disabled=true;try{note('正在安装插件…');const r=await fetch('/api/plugins/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source,ref:$('install-ref').value.trim(),replace:$('install-replace').checked,install_dependencies:$('install-dependencies').checked})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'安装失败');await load();note(`插件 ${d.plugin?.id||''} 已${d.action==='updated'?'更新':'安装'}。`)}catch(e){note(e.message,true)}finally{b.disabled=false}};
load().catch(e=>note(e.message,true));
</script>
<script src="/static/setup_i18n.js"></script>
</body>
</html>
