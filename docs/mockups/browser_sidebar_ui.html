<!doctype html>
<!-- 基础版：已被 browser_sidebar_ui_v3.html（素净版）取代，仅留作对比 -->
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SugarAgent 侧栏 / 手机 UI 原型</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%230f766e'/><path d='M4.4 8h7.2' stroke='%23ffffff' stroke-width='2' stroke-linecap='round'/></svg>">
<style>
  :root{
    --bg:#0b1020; --panel:#111827; --panel-2:#0d1528; --line:#263248;
    --text:#edf2f7; --muted:#94a3b8; --accent:#5eead4; --accent-ink:#04211d;
    --warn:#fbbf24; --warn-bg:#422006; --danger:#fb7185; --ok:#34d399;
    --code-bg:#0f172a; --user-bubble:#123047; --assistant-bubble:#172033;
    --shadow:0 18px 50px rgba(0,0,0,.45);
  }
  html[data-theme="light"]{
    --bg:#eef1f5; --panel:#ffffff; --panel-2:#f6f7f9; --line:#dfe3ea;
    --text:#1b2231; --muted:#6b7280; --accent:#0f766e; --accent-ink:#ffffff;
    --warn:#b45309; --warn-bg:#fef3c7; --danger:#e11d48; --ok:#059669;
    --code-bg:#f3f4f6; --user-bubble:#e0f2fe; --assistant-bubble:#f8fafc;
    --shadow:0 18px 40px rgba(15,23,42,.16);
  }
  @media (prefers-color-scheme: light){
    html[data-theme="system"]{
      --bg:#eef1f5; --panel:#ffffff; --panel-2:#f6f7f9; --line:#dfe3ea;
      --text:#1b2231; --muted:#6b7280; --accent:#0f766e; --accent-ink:#ffffff;
      --warn:#b45309; --warn-bg:#fef3c7; --danger:#e11d48; --ok:#059669;
      --code-bg:#f3f4f6; --user-bubble:#e0f2fe; --assistant-bubble:#f8fafc;
      --shadow:0 18px 40px rgba(15,23,42,.16);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  svg{display:block}

  /* ===== 设计稿工具条 ===== */
  .sheet-bar{
    position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    padding:10px 18px; background:color-mix(in srgb,var(--panel) 88%, transparent);
    border-bottom:1px solid var(--line); backdrop-filter:blur(8px);
  }
  .sheet-bar .brand{font-weight:700; letter-spacing:.3px}
  .sheet-bar .brand small{display:block; font-weight:400; color:var(--muted); font-size:12px}
  .group{display:flex; align-items:center; gap:6px; padding-left:14px; border-left:1px solid var(--line)}
  .group > span.lbl{color:var(--muted); font-size:12px}
  .seg{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .seg button{background:transparent; border:0; padding:6px 10px; color:var(--muted)}
  .seg button.on{background:var(--accent); color:var(--accent-ink); font-weight:600}
  .seg button:hover{color:var(--text)}
  .seg button.on:hover{color:var(--accent-ink)}

  /* ===== 画布 ===== */
  .sheet{display:flex; flex-wrap:wrap; gap:34px; justify-content:center; padding:26px 18px 46px}
  .device{display:flex; flex-direction:column; gap:8px; align-items:center}
  .device > figcaption{color:var(--muted); font-size:12px}
  .frame{
    position:relative; display:flex; flex-direction:column; background:var(--panel);
    border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden;
  }
  #dev-sidebar .frame{width:380px; height:760px}
  #dev-sidebar[data-width="320"] .frame{width:320px}
  #dev-sidebar[data-width="420"] .frame{width:420px}
  #dev-phone .frame{width:390px; height:800px; border-radius:30px}
  .chrome{border-bottom:1px solid var(--line); background:var(--panel-2); color:var(--muted); font-size:11.5px}
  #dev-sidebar .chrome{display:flex; align-items:center; gap:8px; padding:7px 10px}
  #dev-sidebar .chrome .dotrow{display:flex; gap:5px}
  #dev-sidebar .chrome i{width:9px; height:9px; border-radius:50%; background:#3b4557; display:block}
  #dev-sidebar .chrome .url{
    flex:1; text-align:center; background:color-mix(in srgb,var(--bg) 70%, transparent);
    border:1px solid var(--line); border-radius:999px; padding:3px 10px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #dev-phone .chrome{display:flex; justify-content:space-between; padding:6px 16px 4px; font-variant-numeric:tabular-nums}
  .phone-notch{position:absolute; top:6px; left:50%; transform:translateX(-50%); width:96px; height:18px; border-radius:12px; background:var(--bg); border:1px solid var(--line); z-index:3}
  .home-bar{height:18px; display:flex; align-items:center; justify-content:center}
  .home-bar i{width:120px; height:4px; border-radius:3px; background:var(--line); display:block}

  /* ===== 侧栏内部：通用 ===== */
  .app{flex:1; min-height:0; display:flex; flex-direction:column}
  .app-head{display:flex; align-items:center; gap:8px; padding:9px 10px; border-bottom:1px solid var(--line)}
  .status{width:8px; height:8px; border-radius:50%; background:var(--ok); flex:0 0 auto; box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%, transparent)}
  .status.off{background:var(--danger); box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 22%, transparent)}
  .app-head .title{flex:1; min-width:0}
  .app-head .title b{display:block; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .app-head .title small{color:var(--muted); font-size:11px}
  .iconbtn{
    width:30px; height:30px; display:grid; place-items:center; border-radius:9px;
    border:1px solid var(--line); background:color-mix(in srgb,var(--panel-2) 80%, transparent); color:var(--muted);
  }
  .iconbtn:hover{color:var(--text); border-color:color-mix(in srgb,var(--accent) 40%, var(--line))}
  .iconbtn.on{color:var(--accent-ink); background:var(--accent); border-color:var(--accent)}
  .body{flex:1; min-height:0; overflow:auto; padding:12px 12px 4px; display:flex; flex-direction:column; gap:10px}
  .body::-webkit-scrollbar{width:8px}
  .body::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px}

  /* ===== 消息 ===== */
  .msg{max-width:88%; border-radius:14px; padding:9px 11px; border:1px solid var(--line)}
  .msg.user{align-self:flex-end; background:var(--user-bubble)}
  .msg.assistant{align-self:flex-start; background:var(--assistant-bubble); max-width:94%; width:94%}
  .msg h4{margin:2px 0 6px; font-size:13.5px}
  .msg p{margin:0 0 8px}
  .msg ul{margin:0 0 8px; padding-left:18px}
  .msg li{margin:2px 0}
  .msg code.inline{background:var(--code-bg); border:1px solid var(--line); border-radius:6px; padding:0 5px; font-size:12.5px}
  .codeblock{background:var(--code-bg); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:0 0 8px}
  .codeblock header{display:flex; justify-content:space-between; align-items:center; padding:5px 9px; border-bottom:1px solid var(--line); color:var(--muted); font-size:11.5px}
  .codeblock pre{margin:0; padding:9px 10px; overflow:auto; font:12.5px/1.5 ui-monospace,Consolas,monospace}
  .codeblock .k{color:#c792ea}.codeblock .s{color:#ecc48d}.codeblock .c{color:var(--muted)}
  table.md{width:100%; border-collapse:collapse; margin:0 0 8px; font-size:12.5px}
  table.md th,table.md td{border:1px solid var(--line); padding:4px 6px; text-align:left}
  table.md th{background:color-mix(in srgb,var(--panel-2) 70%, transparent); color:var(--muted); font-weight:600}

  /* 折叠块：工具行 / 思考过程 */
  .fold{border:1px solid var(--line); border-radius:11px; background:color-mix(in srgb,var(--panel-2) 65%, transparent); overflow:hidden}
  .fold > button.head{
    width:100%; display:flex; align-items:center; gap:7px; background:transparent; border:0;
    padding:7px 9px; text-align:left; color:var(--muted); font-size:12.5px;
  }
  .fold > button.head b{color:var(--text); font-weight:600}
  .fold .chev{margin-left:auto; transition:transform .16s ease}
  .fold.open .chev{transform:rotate(90deg)}
  .fold .panel{display:none; padding:8px 9px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted)}
  .fold.open .panel{display:block}
  .fold.tool .panel b{color:var(--text)}
  .kbd{font:11.5px ui-monospace,Consolas,monospace; border:1px solid var(--line); border-radius:5px; padding:0 4px; color:var(--muted)}

  /* 状态 / 进度 / 子代理 */
  .statusrow{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12.5px; padding:0 2px}
  .spinner{width:12px; height:12px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .progress{display:flex; flex-direction:column; gap:4px}
  .progress .bar{height:5px; border-radius:4px; background:var(--line); overflow:hidden}
  .progress .bar i{display:block; height:100%; background:var(--accent); width:62%}
  .badge-sub{display:inline-flex; align-items:center; gap:6px; border:1px dashed var(--line); border-radius:999px; padding:2px 9px; color:var(--muted); font-size:11.5px; align-self:flex-start}
  .attach{display:flex; gap:8px; align-items:center; border:1px solid var(--line); border-radius:11px; padding:6px; align-self:flex-start; background:color-mix(in srgb,var(--panel-2) 60%, transparent)}
  .attach .thumb{width:52px; height:38px; border-radius:7px; border:1px solid var(--line); background:linear-gradient(135deg,#334155,#0f172a); display:grid; place-items:center; color:#94a3b8; font-size:10px}
  .attach small{color:var(--muted); display:block; font-size:11px}

  /* 审批卡 */
  .approval{border:1px solid color-mix(in srgb,var(--warn) 55%, var(--line)); background:var(--warn-bg); border-radius:12px; padding:9px 10px; align-self:stretch; color:var(--text)}
  .approval h5{margin:0 0 4px; font-size:13px; display:flex; align-items:center; gap:6px}
  .approval .cmd{background:var(--code-bg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:12.5px ui-monospace,Consolas,monospace; margin:6px 0 8px; overflow:auto}
  .approval .acts{display:flex; gap:7px; flex-wrap:wrap; align-items:center}
  .btn{border:1px solid var(--line); background:color-mix(in srgb,var(--panel) 75%, transparent); border-radius:9px; padding:6px 11px; font-size:12.5px}
  .btn:hover{border-color:color-mix(in srgb,var(--accent) 45%, var(--line))}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
  .btn.danger{color:var(--danger); border-color:color-mix(in srgb,var(--danger) 45%, var(--line))}
  .btn:disabled{opacity:.5; cursor:not-allowed}
  .analysis{margin-top:8px; border-top:1px dashed color-mix(in srgb,var(--warn) 45%, var(--line)); padding-top:7px; font-size:12.5px; color:var(--muted)}
  .analysis b{color:var(--text)}
  .resolved{border:1px dashed var(--line); border-radius:11px; padding:6px 9px; color:var(--muted); font-size:12.5px; align-self:stretch}

  /* 输入区 */
  .composer{border-top:1px solid var(--line); padding:8px 10px 10px; background:var(--panel); display:flex; flex-direction:column; gap:7px}
  .chips{display:flex; gap:6px; flex-wrap:wrap}
  .chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:3px 4px 3px 9px; font-size:11.5px; color:var(--muted); background:color-mix(in srgb,var(--panel-2) 70%, transparent)}
  .chip b{color:var(--text); font-weight:600}
  .chip button{border:0; background:transparent; color:var(--muted); width:18px; height:18px; border-radius:50%}
  .chip button:hover{color:var(--danger); background:color-mix(in srgb,var(--danger) 15%, transparent)}
  .chip.add{border-style:dashed; cursor:pointer}
  .chip.add:hover{color:var(--text)}
  .input{display:flex; align-items:flex-end; gap:7px; border:1px solid var(--line); border-radius:12px; padding:7px 8px; background:color-mix(in srgb,var(--panel-2) 70%, transparent)}
  .input textarea{flex:1; min-height:22px; max-height:96px; resize:none; border:0; background:transparent; outline:none; color:var(--text)}
  .input textarea::placeholder{color:var(--muted)}
  .hint{color:var(--muted); font-size:11px; display:flex; gap:10px; flex-wrap:wrap}

  /* 历史面板（Page Assist 风格） */
  .panel-head{padding:9px 10px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px}
  .search{display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:10px; padding:6px 9px; background:color-mix(in srgb,var(--panel-2) 70%, transparent)}
  .search input{flex:1; border:0; background:transparent; outline:none}
  .group-label{color:var(--muted); font-size:11.5px; padding:8px 4px 2px}
  .sess{position:relative; display:flex; gap:8px; align-items:center; padding:8px 9px; border:1px solid transparent; border-bottom-color:var(--line); cursor:pointer}
  .sess:hover{background:color-mix(in srgb,var(--panel-2) 75%, transparent)}
  .sess .txt{flex:1; min-width:0}
  .sess .txt b{display:block; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sess .txt small{color:var(--muted); font-size:11px}
  .pill{font-size:10.5px; border-radius:999px; padding:1px 7px; border:1px solid var(--line); color:var(--muted)}
  .pill.unread{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
  .pill.appr{background:var(--warn-bg); border-color:var(--warn); color:var(--warn)}
  .menu{position:absolute; right:8px; top:34px; z-index:5; min-width:132px; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); overflow:hidden}
  .menu button{display:block; width:100%; text-align:left; border:0; background:transparent; padding:7px 10px; font-size:12.5px}
  .menu button:hover{background:color-mix(in srgb,var(--panel-2) 80%, transparent)}
  .menu button.danger{color:var(--danger)}
  .menu hr{border:0; border-top:1px solid var(--line); margin:0}

  /* 配对 / 设置 */
  .card{border:1px solid var(--line); border-radius:12px; padding:11px; background:color-mix(in srgb,var(--panel-2) 60%, transparent); display:flex; flex-direction:column; gap:9px}
  .card h4{margin:0; font-size:13.5px}
  .card p{margin:0; color:var(--muted); font-size:12.5px}
  .field{display:flex; flex-direction:column; gap:4px}
  .field label{color:var(--muted); font-size:11.5px}
  .field input,.field select{border:1px solid var(--line); border-radius:9px; padding:7px 9px; background:var(--panel); outline:none}
  .code-inline{font:12.5px ui-monospace,Consolas,monospace; background:var(--code-bg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; overflow:auto}
  .row{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:0}
  .row .grow{flex:1}
  .row small{color:var(--muted); display:block; font-size:11.5px}
  .switch{position:relative; width:40px; height:22px; border-radius:999px; border:1px solid var(--line); background:color-mix(in srgb,var(--panel) 70%, transparent)}
  .switch i{position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--muted); transition:.16s}
  .switch.on{background:var(--accent); border-color:var(--accent)}
  .switch.on i{left:20px; background:var(--accent-ink)}
  .toast{align-self:center; margin:0 auto 6px; background:color-mix(in srgb,var(--panel) 92%, transparent); border:1px solid var(--line); color:var(--text); border-radius:999px; padding:5px 12px; font-size:12px; box-shadow:var(--shadow)}
  .legend{max-width:900px; margin:0 auto; color:var(--muted); font-size:12px; padding:0 18px 40px}
  .legend code{background:var(--code-bg); border:1px solid var(--line); border-radius:6px; padding:0 4px}
</style>
</head>
<body>

<header class="sheet-bar">
  <div class="brand">SugarAgent 侧栏 / 手机 UI 原型<small>静态稿 · 数据为示例 · 对照设计文档 v2.1（D1–D20）</small></div>

  <div class="group"><span class="lbl">视图</span>
    <div class="seg" id="seg-view">
      <button data-view="chat" class="on">对话</button>
      <button data-view="history">历史</button>
      <button data-view="pair">配对</button>
      <button data-view="settings">设置</button>
    </div>
  </div>

  <div class="group"><span class="lbl">主题</span>
    <div class="seg" id="seg-theme">
      <button data-theme="system" class="on">跟随系统</button>
      <button data-theme="dark">深</button>
      <button data-theme="light">浅</button>
    </div>
  </div>

  <div class="group"><span class="lbl">语言</span>
    <div class="seg" id="seg-lang">
      <button data-lang="zh" class="on">中文</button>
      <button data-lang="en">EN</button>
    </div>
  </div>

  <div class="group"><span class="lbl">侧栏宽</span>
    <div class="seg" id="seg-width">
      <button data-width="320">320</button>
      <button data-width="380" class="on">380</button>
      <button data-width="420">420</button>
    </div>
  </div>

  <div class="group"><span class="lbl">连接态</span>
    <div class="seg" id="seg-conn">
      <button data-conn="on" class="on">已连接</button>
      <button data-conn="off">离线</button>
    </div>
  </div>
</header>

<main class="sheet">
  <figure class="device" id="dev-sidebar" data-width="380">
    <div class="frame">
      <div class="chrome">
        <span class="dotrow"><i></i><i></i><i></i></span>
        <span class="url" id="chrome-url">https://example.com/myagent-design-doc</span>
        <span style="font-size:11px">侧栏</span>
      </div>
      <div class="app" data-frame="sidebar"></div>
    </div>
    <figcaption>扩展侧栏（Chrome/Edge sidePanel，320–420px）</figcaption>
  </figure>

  <figure class="device" id="dev-phone" data-width="390">
    <div class="frame">
      <div class="phone-notch"></div>
      <div class="chrome"><span>9:41</span><span>SugarAgent</span><span>5G ▮</span></div>
      <div class="app" data-frame="phone"></div>
      <div class="home-bar"><i></i></div>
    </div>
    <figcaption>手机窄屏（同套 UI，未读/审批走同一信息架构）</figcaption>
  </figure>
</main>

<p class="legend">
  原型覆盖：单会话头部（状态点/会话标题/历史·新建·设置）、运行中与停止、工具行与思考过程折叠、上下文进度条、子代理徽标、
  附件缩略图、审批卡（允许/拒绝选填理由 + AI 分析）、上下文芯片三来源（正文/选中/仅网址）、
  Page Assist 式历史面板（搜索、分组、未读与待审批徽标、改名/归档/置顶/待办/删除）、配对页、设置页。
  文案已内置中文/英文两套（示例对话内容不随语言切换）；主题支持跟随系统。
</p>

<script>
(function(){
  "use strict";

  var state = {
    view: "chat",
    theme: "system",
    lang: "zh",
    conn: "on",
    ctx: "page",          // page | selection | url | none
    approval: "pending",  // pending | analyzed | approved | rejected
    open: { tool: false, think: false },
    query: "",
    menu: "",
    running: true,
    toast: "",
    archived: {},
    sessions: [
      { id: "s1", name: "\u89d2\u6807\u4fee\u590d\u4f1a\u8bdd", meta: "10 \u5206\u949f\u524d", unread: 2, appr: 1, group: "today" },
      { id: "s2", name: "RAG \u77e5\u8bc6\u5e93\u8c03\u7814", meta: "2 \u5c0f\u65f6\u524d", unread: 0, appr: 0, group: "today" },
      { id: "s3", name: "\u524d\u7aef dock \u91cd\u6784\u8bc4\u5ba1", meta: "\u6628\u5929 21:40", unread: 0, appr: 0, group: "yesterday" },
      { id: "s4", name: "\u8fdc\u63a7\u65b9\u6848\u8bbe\u8ba1", meta: "\u672c\u5468\u4e8c", unread: 0, appr: 0, group: "week" },
      { id: "s5", name: "\u65e7\u4f1a\u8bdd\uff1a\u6392\u67e5\u542f\u52a8\u53cc\u7a97\u53e3", meta: "8 \u6708 12 \u65e5", unread: 0, appr: 0, group: "earlier" }
    ]
  };

  var I18N = {
    zh: {
      chat: "对话", history: "历史", pair: "配对", settings: "设置",
      connected: "已连接 · 本地 Agent", offline: "离线 · 无法连接本机 Agent",

        : '') +

  function historyHtml(){
    var q = state.query.trim().toLowerCase();
    var groups = [["today", t("today")], ["yesterday", t("yesterday")], ["week", t("week")], ["earlier", t("earlier")]];
    var list = "";
    groups.forEach(function(g){
      var items = state.sessions.filter(function(s){
        if (state.archived[s.id]) return false;
        if (s.group !== g[0]) return false;
        if (q && s.name.toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
      if (!items.length) return;
      list += '<div class="group-label">' + g[1] + '</div>';
      items.forEach(function(s){
        list += '<div class="sess" data-act="sess" data-sid="' + s.id + '">' +
          '<span style="color:var(--muted)">' + icon("clock") + '</span>' +
          '<span class="txt"><b>' + esc(s.name) + '</b><small>' + s.meta + '</small></span>' +
          (s.appr ? '<span class="pill appr">' + t("approvalTitle").split("\uff1a")[0].slice(0,4) + '1</span>' : '') +
          (s.unread ? '<span class="pill unread">' + s.unread + '</span>' : '') +
          '<button class="iconbtn" data-act="sess-menu" data-sid="' + s.id + '" style="width:26px;height:26px">\u22ef</button>' +
          (state.menu === s.id ? sessMenu(s.id) : '') +
        '</div>';
      });
    });
    var archived = state.sessions.filter(function(s){ return state.archived[s.id]; });
    if (archived.length){
      list += '<div class="group-label">' + t("archived") + ' (' + archived.length + ')</div>';
      archived.forEach(function(s){
        list += '<div class="sess" data-act="sess" data-sid="' + s.id + '"><span style="color:var(--muted)">' + icon("clock") + '</span><span class="txt"><b>' + esc(s.name) + '</b><small>' + t("archived") + '</small></span></div>';
      });
    }
    if (!list){ list = '<div class="group-label" style="text-align:center;padding:24px 0">\u2014</div>'; }

    return headHtml() +
      '<div class="panel-head">' +
        '<div style="display:flex;align-items:center;gap:8px"><b>' + t("historyTitle") + '</b>' +
          '<button class="btn" data-act="new-session" style="margin-left:auto">+ ' + t("newSession") + '</button></div>' +
        '<div class="search">\uf002<input data-act="search" value="' + esc(state.query) + '" placeholder="' + t("searchPh") + '"></div>' +
      '</div>' +
      '<div class="body" style="padding:0 6px 6px">' + list + '</div>' +
      (state.toast ? '<div class="composer"><div class="toast">' + esc(state.toast) + '</div></div>' : '');
  }

  /* ---------- 工具函数 ---------- */
  function esc(v){
    return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function activeSession(){
    for (var i = 0; i < state.sessions.length; i++){
      if (!state.archived[state.sessions[i].id]) return state.sessions[i];
    }
    return { name: "-" };
  }
  function ctxLabel(){
    return state.ctx === "page" ? t("ctxPage") : state.ctx === "selection" ? t("ctxSel") : t("ctxUrl");
  }
  function flash(msg){
    state.toast = msg;
    render();
    clearTimeout(flash._t);
    flash._t = setTimeout(function(){ state.toast = ""; render(); }, 1600);
  }

  /* ---------- 渲染 ---------- */
  function render(){
    document.documentElement.setAttribute("data-theme", state.theme);
    I18N.zh.ctxNameNext = state.ctx === "page" ? I18N.zh.ctxSel : state.ctx === "selection" ? I18N.zh.ctxUrl : I18N.zh.ctxPage;
    I18N.en.ctxNameNext = state.ctx === "page" ? I18N.en.ctxSel : state.ctx === "selection" ? I18N.en.ctxUrl : I18N.en.ctxPage;
    var html = state.view === "chat" ? chatHtml() : state.view === "history" ? historyHtml() : state.view === "pair" ? pairHtml() : settingsHtml();
    Array.prototype.forEach.call(document.querySelectorAll(".app"), function(el){
      el.innerHTML = html;   // 保持顶部（composer 常驻底部），便于对照设计稿
    });
  }

  /* ---------- 交互（事件委托） ---------- */
  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-act], .seg button");
    if (!el) return;

    // 顶部工具条
    if (el.matches(".seg button")){
      var seg = el.parentElement;
      if (seg.id === "seg-view") state.view = el.getAttribute("data-view");
      if (seg.id === "seg-theme") state.theme = el.getAttribute("data-theme");
      if (seg.id === "seg-lang") state.lang = el.getAttribute("data-lang");
      if (seg.id === "seg-width") document.getElementById("dev-sidebar").setAttribute("data-width", el.getAttribute("data-width"));
      if (seg.id === "seg-conn") state.conn = el.getAttribute("data-conn");
      Array.prototype.forEach.call(seg.children, function(b){ b.classList.toggle("on", b === el); });
      render();
      return;
    }

    var act = el.getAttribute("data-act");
    if (el.matches(".sess") && !el.hasAttribute("data-act")) act = "sess";
    switch (act){
      case "view": state.view = el.getAttribute("data-view"); state.menu = ""; render(); break;
      case "new-session": flash(state.lang === "zh" ? "\u5df2\u65b0\u5efa\u4f1a\u8bdd\uff08session.create\uff09" : "New session created (session.create)"); break;
      case "sess": state.view = "chat"; state.menu = ""; var sid = el.getAttribute("data-sid"); state.sessions.forEach(function(s){ if (s.id === sid) s.unread = 0; }); render(); break;
      case "sess-open": state.view = "chat"; state.menu = ""; render(); break;
      case "sess-menu": e.stopPropagation(); state.menu = state.menu === el.getAttribute("data-sid") ? "" : el.getAttribute("data-sid"); render(); break;
      case "op":
        var op = el.getAttribute("data-op"), id = el.getAttribute("data-sid");
        if (op === "archive") state.archived[id] = true;
        if (op === "delete") state.sessions = state.sessions.filter(function(s){ return s.id !== id; });
        state.menu = "";
        flash({ rename: t("renamed"), pin: t("pinned"), todo: t("todoOk"), archive: t("archivedOk"), delete: t("deleted") }[op] || "");
        break;
      case "tool-toggle": state.open.tool = !state.open.tool; render(); break;
      case "think-toggle": state.open.think = !state.open.think; render(); break;
      case "ctx-cycle":
        state.ctx = state.ctx === "page" ? "selection" : state.ctx === "selection" ? "url" : "page";
        flash(t("added"));
        break;
      case "ctx-remove": state.ctx = "none"; flash(t("clearCtx")); break;
      case "analyze": state.approval = "analyzed"; render(); break;
      case "allow": state.approval = "approved"; render(); break;
      case "deny": state.approval = "rejected"; render(); break;
      case "stop": state.running = false; flash(state.lang === "zh" ? "\u5df2\u53d1\u9001 session.interrupt" : "Sent session.interrupt"); break;
      case "send": state.running = true; flash(state.lang === "zh" ? "\u5df2\u53d1\u9001\uff08session.send\uff09" : "Sent (session.send)"); break;
      case "attach": flash(state.lang === "zh" ? "\u53ef\u9009\uff1a\u622a\u56fe / \u56fe\u7247 / \u6587\u6863" : "Choose: screenshot / image / document"); break;
      case "pair": flash(state.lang === "zh" ? "\u914d\u5bf9\u6210\u529f\uff1a\u8bbe\u5907 Chrome \u4fa7\u680f\uff08read/write/approvals\uff09" : "Paired: Chrome sidebar (read/write/approvals)"); break;
      case "clear": flash(state.lang === "zh" ? "\u5df2\u6e05\u9664\u672c\u673a\u51ed\u636e\uff08\u8bbe\u5907\u64a4\u9500\u9700\u5728\u7535\u8111\u7aef\uff09" : "Local credential cleared (revoke on desktop)"); break;
      case "switch": el.classList.toggle("on"); break;
      default: break;
    }
  });

  document.addEventListener("input", function(e){
    if (e.target.matches("[data-act='search']")){
      state.query = e.target.value;
      render();
      var box = document.querySelector("[data-act='search']");
      if (box){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
    }
  });

  document.addEventListener("change", function(e){
    if (e.target.matches("[data-act='lang']")){ state.lang = e.target.value === "auto" ? (navigator.language && navigator.language.indexOf("zh") === 0 ? "zh" : "en") : e.target.value; render(); }
    if (e.target.matches("[data-act='theme']")){ state.theme = e.target.value; render(); }
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){ state.menu = ""; render(); }
  });

  render();
})();
</script>
</body>
</html>
