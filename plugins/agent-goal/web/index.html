<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goal Workflow</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Goal Workflow</h1><p>Inspect and review the durable goal for a session.</p><form id="select"><label>Session ID <input id="session" required maxlength="256"></label><button>Open</button></form><div id="error" role="alert"></div><section id="card" hidden><pre id="state"></pre><div class="actions"><button data-action="pause">Pause</button><button data-action="resume">Resume</button><button data-action="delete">Delete</button></div><h2>Completion review</h2><label>Feedback<textarea id="feedback" maxlength="8000"></textarea></label><div class="actions"><button data-review="approve">Approve</button><button data-review="save">Save</button><button data-review="continue">Continue</button></div></section></main><script src="app.js"></script></body></html>
